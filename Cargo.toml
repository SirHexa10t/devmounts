[package]
name = "devmounts"
version = "0.1.0"
edition = "2024"
# Set by let chains (`if let … && let …`), stable in edition 2024 since 1.88; no dependency needs more.
rust-version = "1.88"
description = "Point short, stable links at paths inside devices, wherever the OS mounted them"
license = "GPL-3.0-only"

[features]
default = ["cli"]
# The command-line front end. Library users can opt out with `default-features = false`.
cli = ["dep:clap"]

[[bin]]
name = "devmounts"
path = "src/main.rs"
required-features = ["cli"]

# Runs the binary, which only a `cli` build has.
[[test]]
name = "cli"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
toml = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
